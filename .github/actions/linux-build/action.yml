# The Linux build the image needs, shared by ci.yml and release.yml: JDK 17 (Gradle) and 24 (the runtime), the
# runtime's libraries (`gradle deps`), work/apksim.jar (scripts/build.sh) and the test app with its androidTest APK
# (the image trains its startup cache on the test app; CI runs its suite).
name: linux-build
description: Fetch the libraries, compile the runtime and build the test app on a Linux runner
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        # 17 runs Gradle; 24 (the last, so JAVA_HOME) compiles the runtime, as on the Mac.
        java-version: |
          17
          24
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14.2
    - name: Fetch the runtime's libraries
      shell: bash
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: |
        gradle -q deps --console=plain
        for a in work/lib/*.aar; do unzip -p "$a" classes.jar > "${a%.aar}.jar"; done
    - name: Compile the runtime
      shell: bash
      run: scripts/build.sh
    - name: Build the test app
      shell: bash
      working-directory: testapks/composeapp
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: ./gradlew -q :app:assembleDebug :app:assembleDebugAndroidTest
