# The documentation site: https://apksim.web.app (Firebase Hosting, Google Cloud project "apksim").
# scripts/docs-site.py assembles the pages from website/pages, the README's sections and docs/*.md, and Zensical
# builds them. Only main deploys. A pull request that touches a source only builds, failing on a link between pages
# with no target.
# The deploy signs in with the FIREBASE_SERVICE_ACCOUNT repository secret: the JSON key of a service account that
# may deploy to Firebase Hosting in that project and nothing else. Without the secret the deploy step is skipped
# with a warning, and `scripts/docs-site.py --deploy` from a signed-in machine publishes instead.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'website/**'
      - 'scripts/docs-site.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'website/**'
      - 'scripts/docs-site.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - name: Build, and fail on a broken link between pages
        run: scripts/docs-site.py --strict
      - name: Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set: the site was built but not deployed"
            exit 0
          fi
          key="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          npm install --global firebase-tools@15.12.0
          GOOGLE_APPLICATION_CREDENTIALS="$key" scripts/docs-site.py --strict --deploy
          rm -f "$key"
