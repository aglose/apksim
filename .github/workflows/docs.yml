# The documentation site: https://apksim.web.app (Firebase Hosting, Google Cloud project "apksim").
# scripts/docs-site.py assembles the pages from website/pages, the README's sections and docs/*.md, and Zensical
# builds them.
# - A pull request that touches a source only builds, failing on a link between pages with no target.
# - A push to main that touches a source, and every published release, deploys the whole site: a copy of the docs per
#   release tag (/X.Y.Z/, built from the tag by the tag's own script), /dev/ from main, /latest/ (the newest
#   release's copy) and the version picker's list. Nothing is stored between runs: each deploy builds every copy
#   again, so the tags are the only record. Publishing a release is what moves /latest/ to it.
# The deploy signs in with the FIREBASE_SERVICE_ACCOUNT repository secret: the JSON key of a service account that
# may deploy to Firebase Hosting in that project and nothing else. Without the secret the deploy step is skipped
# with a warning, and `scripts/docs-site.py --all-versions --deploy` from a signed-in machine publishes instead.
# A deploy stops rather than publish when GitHub's release list cannot be read or the newest release's copy fails.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'website/**'
      - 'scripts/docs-site.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'website/**'
      - 'scripts/docs-site.py'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one after another and are never cancelled; a pull request's newer push replaces its older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'docs-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # reads the release notes for the changelog page (public data; the token only lifts the rate limit)
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a release's event is on its tag: the site is always built from main, with every tag at hand
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      # Every copy is built on a pull request too, so that the per-release path is exercised before a merge.
      # GitHub's release list is needed on main (it says which tags are released); a pull request builds without it
      # when it cannot be read.
      - name: Build every version, and fail on a broken link between pages
        run: scripts/docs-site.py --strict --all-versions
      - name: Install the Firebase CLI
        if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        run: npm install --global firebase-tools@15.12.0
      # Only this step has the key: the build above and the CLI's install ran without it.
      - name: Deploy to Firebase Hosting
        if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set: the site is built but not deployed"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          unset FIREBASE_SERVICE_ACCOUNT
          GOOGLE_APPLICATION_CREDENTIALS="$key" scripts/docs-site.py --deploy-only
