# Builds the runtime and the Linux image, then runs the test app headless in it (scripts/ci-smoke.sh) and its
# androidTest suite with --instrument (JUnit XML in the artifact), and checks the DEX translator on an R8 fixture.
# The Mac-only parts (window, Metal, VideoToolbox, AOT timings) are not covered here.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the privacy check reads every new commit
      # Personal information (the owner's apps, employer, servers, emails) must never reach the repo. The terms are
      # the PRIVATE_DENYLIST secret, never printed: reports name the file and line or the commit, not the text.
      - name: No personal information
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          status=0
          scripts/hooks/check-private --tree || status=1
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/hooks/check-private --commits "$BASE..$HEAD_SHA" || status=1
          fi
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | scripts/hooks/check-private --text "pull request title or body" || status=1
          printf '%s\n' "$HEAD_REF" | scripts/hooks/check-private --text "branch name" || status=1
          exit $status
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 runs Gradle; 24 (the last, so JAVA_HOME) compiles the runtime, as on the Mac.
          java-version: |
            17
            24
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2
      - name: Fetch the runtime's libraries
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          gradle -q deps --console=plain
          for a in work/lib/*.aar; do unzip -p "$a" classes.jar > "${a%.aar}.jar"; done
      - name: Compile the runtime
        run: scripts/build.sh
      - name: Translator check (R8 and D8 fixtures)
        run: scripts/check-translator.sh
      - name: Build the test app
        working-directory: testapks/composeapp
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew -q :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build the image
        run: scripts/docker-build.sh apksim:ci
      - name: Smoke test
        run: scripts/ci-smoke.sh apksim:ci testapks/composeapp/app/build/outputs/apk/debug/app-debug.apk smoke
      - name: Test run (androidTest suite, GLES on Mesa)
        run: |
          mkdir -p tests
          cp testapks/composeapp/app/build/outputs/apk/debug/app-debug.apk tests/app.apk
          cp testapks/composeapp/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk tests/test.apk
          python3 scripts/instrument.py --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" app.apk test.apk \
            --xml tests/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke/*.png
            smoke/*.log
            tests/junit.xml
