# Builds the runtime and the Linux image, then runs the test app headless in it (scripts/ci-smoke.sh, with the adb
# device check of scripts/adb-check.py, the network check of scripts/network-check.sh and screenshot tests of
# scripts/snapshot.py) and its androidTest suite with --instrument (JUnit XML in the artifact), checks the DEX
# translator on an R8 fixture, and checks test-impact selection and balanced shards (scripts/affected-check.py).
# The Mac-only parts (window, Metal, VideoToolbox, AOT timings) are not covered here.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the privacy check reads every new commit
      # Personal information (the owner's apps, employer, servers, emails) must never reach the repo. The terms are
      # the PRIVATE_DENYLIST secret, never printed: reports name the file and line or the commit, not the text.
      - name: No personal information
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          status=0
          scripts/hooks/check-private --tree || status=1
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/hooks/check-private --commits "$BASE..$HEAD_SHA" || status=1
          fi
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | scripts/hooks/check-private --text "pull request title or body" || status=1
          printf '%s\n' "$HEAD_REF" | scripts/hooks/check-private --text "branch name" || status=1
          exit $status
      - name: Build the runtime and the test app
        uses: ./.github/actions/linux-build
      - name: Translator check (R8 and D8 fixtures)
        run: scripts/check-translator.sh
      - name: instrument.py check (test processes that die, against a stand-in apksim)
        run: python3 scripts/instrument-check.py
      - name: Build the image
        run: scripts/docker-build.sh apksim:ci
      - name: Smoke test
        run: |
          # The runner's Android SDK has adb, for the adb device check (adb-check.py).
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          scripts/ci-smoke.sh apksim:ci testapks/composeapp/app/build/outputs/apk/debug/app-debug.apk smoke \
            testapks/composeapp/uiserver/build/outputs/apk/debug/uiserver-debug.apk
      - name: Test run (androidTest suite, GLES on Mesa)
        run: |
          mkdir -p tests
          cp testapks/composeapp/app/build/outputs/apk/debug/app-debug.apk tests/app.apk
          cp testapks/composeapp/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk tests/test.apk
          python3 scripts/instrument.py --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" app.apk test.apk \
            --xml tests/junit.xml -e timezone America/New_York -- --timezone America/New_York --test-outputs /work/outputs
          # The runner's listener (RecordingListener) wrote through Test Storage after each test's teardown.
          test -s "tests/outputs/googletest/test_outputfiles/listener/dev.apksim.composeapp.RunnerListenersTest#theRunnersListenerHearsTheTest.txt"
          test -s tests/outputs/googletest/test_outputfiles/storage-check/out.txt
          # Opening a missing file to read made nothing.
          test ! -e tests/outputs/googletest/test_outputfiles/never-written
          # Again with the clock following real time (opt-in), which RealTimeClockTest needs.
          python3 scripts/instrument.py --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" app.apk test.apk \
            --xml tests/junit-realtime.xml -e timezone America/New_York -e realtimeClock true \
            -- --timezone America/New_York --realtime-clock
      # Runner listeners named with -e listener: an InstrumentationRunListener gets the instrumentation, as
      # AndroidJUnitRunner gives it, and a listener that cannot be made fails the run.
      - name: Test run with extra runner listeners
        run: |
          python3 scripts/instrument.py --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" app.apk test.apk \
            --xml tests/junit-listeners.xml -e class dev.apksim.composeapp.RunnerListenersTest \
            -e listener androidx.test.internal.runner.listener.SuiteAssignmentPrinter
          status=0
          python3 scripts/instrument.py --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" app.apk test.apk \
            --xml tests/junit-badlistener.xml -e class dev.apksim.composeapp.RunnerListenersTest \
            -e listener does.not.Exist || status=$?
          test "$status" = 1
      # NetworkReplayTest against the committed recording (docs/network.md): every test but the one that leaves an
      # unmatched request on purpose passes, and that one fails with the request named.
      - name: Test run with the network replayed
        run: |
          cp testapks/composeapp/app/src/androidTest/network/greeting.har tests/greeting.har
          status=0
          python3 scripts/instrument.py --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" app.apk test.apk \
            --xml tests/junit-network.xml -e class dev.apksim.composeapp.NetworkReplayTest -e networkReplay true \
            -e unmatchedOnPurpose true -- --network replay /work/greeting.har || status=$?
          test "$status" = 1
          python3 - tests/junit-network.xml <<'EOF'
          import sys, xml.etree.ElementTree as ET
          cases = {c.get("name"): c.find("failure") for c in ET.parse(sys.argv[1]).iter("testcase")}
          failed = sorted(n for n, f in cases.items() if f is not None)
          assert len(cases) == 7, f"tests: {sorted(cases)}"
          assert failed == ["z_anUnmatchedRequestLeftUnclearedFailsItsTest"], f"failed: {failed}"
          assert "POST https://api.apksim.test/v1/elsewhere" in cases[failed[0]].text, cases[failed[0]].text
          print(f"{len(cases)} network replay tests, failed as meant: {failed}")
          EOF
      # ProcessDeathTest's two crashing tests end the process (a halt, the Timeout watchdog): instrument.py must
      # report those two failed and still run every other test, in new processes.
      - name: Test run that ends its process on purpose
        run: |
          status=0
          python3 scripts/instrument.py --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" app.apk test.apk \
            --xml tests/junit-crash.xml -e crashOnPurpose true || status=$?
          test "$status" = 1
          python3 - tests/junit.xml tests/junit-crash.xml <<'EOF'
          import sys, xml.etree.ElementTree as ET
          def cases(f):
              return {(c.get("classname"), c.get("name")): c.find("failure") is not None for c in ET.parse(f).iter("testcase")}
          normal, crash = cases(sys.argv[1]), cases(sys.argv[2])
          failed = sorted(m for (c, m), f in crash.items() if f)
          assert set(crash) == set(normal), f"tests differ: {set(crash) ^ set(normal)}"
          assert failed == ["b_haltsTheProcess", "d_ignoresInterruptsPastItsTimeout"], f"failed: {failed}"
          print(f"{len(crash)} tests, failed as meant: {failed}")
          EOF
      # The same suite split over 3 processes at once (-e numShards/shardIndex): every test once, the same results.
      - name: Test run in shards
        run: |
          python3 scripts/instrument.py --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" app.apk test.apk \
            --xml tests/junit-sharded.xml --shards 3 -e timezone America/New_York -- --timezone America/New_York
          python3 - tests/junit.xml tests/junit-sharded.xml <<'EOF'
          import sys, xml.etree.ElementTree as ET
          def cases(f):
              return [(c.get("classname"), c.get("name"), c.find("failure") is not None) for c in ET.parse(f).iter("testcase")]
          whole, sharded = cases(sys.argv[1]), cases(sys.argv[2])
          assert len(set(sharded)) == len(sharded), "a test ran twice"
          assert sorted(sharded) == sorted(whole), f"results differ: {set(sharded) ^ set(whole)}"
          print(f"{len(sharded)} tests in 3 shards, as in one process")
          EOF
      # Failure bundles (--bundles): the test app's FailureBundle*Test classes fail on purpose, and each failure must
      # leave its screen, tree, log, threads and repro.sh (scripts/bundle-check.py says what it checks).
      - name: Failure bundles
        run: |
          python3 scripts/bundle-check.py app.apk test.apk bundle-check \
            --apksim "docker run --rm -v $PWD/tests:/work apksim:ci" --local tests
      # Test impact (docs/affected-tests.md): record the suite, break a source file and rebuild it, and check that the
      # tests --affected-by picks include every test the break fails and leave others out; then balanced shards.
      - name: Affected tests and balanced shards
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}  # Gradle, for the rebuilds
        run: python3 scripts/affected-check.py --image apksim:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke/*.png
            smoke/*.log
            smoke/network/*.log
            smoke/network/rec.har
            smoke/snapshots/*.log
            smoke/snapshots/*/report.html
            smoke/snapshots/*/results.json
            smoke/snapshots/*/actual/**
            smoke/snapshots/*/golden/**
            smoke/snapshots/*/diff/**
            tests/junit.xml
            tests/junit-network.xml
            tests/junit-realtime.xml
            tests/junit-crash.xml
            tests/junit-sharded.xml
            tests/bundle-check
