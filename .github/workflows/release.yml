# Builds the self-contained release for Apple Silicon Macs (scripts/package-release.sh) and checks it starts as an
# installed copy would: from a read-only folder, training its startup cache, then launching the test app headless.
# - A pushed tag vX.Y.Z makes a draft GitHub release with the tarball, SHA256SUMS and the test app. Publishing the
#   draft (by hand, after reading its notes) runs the `tap` job.
# - The `tap` job writes packaging/homebrew/apksim.rb with the release's version and checksum into the
#   aglose/homebrew-apksim tap, so `brew tap aglose/apksim`, `brew trust aglose/apksim` and `brew install apksim` get it. It pushes with the
#   TAP_DEPLOY_KEY secret, the private half of a deploy key with write access to that repository only, and is skipped
#   without one.
# - The Linux image (docker/Dockerfile), for CI on Linux runners: `apks` builds the test app once (Android's build tools
#   are x86_64-only), `image` builds the image for linux/amd64 and linux/arm64 side by side, each on its own architecture,
#   and `check` runs the checks on each in parallel legs (scripts/ci-smoke.sh split by SMOKE_PARTS as ci.yml splits it,
#   and the test app's androidTest suite in two shards through the image's own instrument.py). On a tag, once every leg
#   and the Mac package passed, `push` pushes ghcr.io/aglose/apksim:VERSION-amd64 and VERSION-arm64 and `draft` makes
#   ghcr.io/aglose/apksim:VERSION the two together (so a pull gets the host's own) and then the draft release.
#   Publishing the release moves :latest to it (`image-latest`). The package must be public once (its settings on
#   GitHub) for other repositories' CI to pull it without a token.
#   Before (0.39), one job per architecture ran every check in turn and arm64 waited for amd64: ~85 min; now ~20.
# - Pull requests check what they can break without releasing (`changes` decides): the Mac package when they change
#   what it is built from or ships, the images and their legs only when they change how the images are built (ci.yml
#   already builds and checks the amd64 image, and the arm64 one for changes that can differ there, on every code
#   change). `release-checks` passes when every job that ran passed, so it can be a required check; a path filter on
#   the workflow would leave it pending for ever on the pull requests it skips.
# - A new push to a pull request cancels its older run, as ci.yml's do; tag and release runs always finish.
name: release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request changed (tags and manual runs run everything):
  # - package: what the Mac package is built from or ships (the launcher, setup, training, packaging, the scripts).
  # - image: how the release images are built and checked (this file, docker/, the image build script, the Linux build
  #   action). Other changes reach the same image through ci.yml's legs.
  # If the diff step fails, its outputs are empty and everything runs.
  changes:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.diff.outputs.package }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          package=true image=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --no-renames --name-only "$BASE...$HEAD_SHA")
            img='^(\.github/workflows/release\.yml|docker/|scripts/docker-build\.sh$|\.github/actions/linux-build/)'
            pkg='^(\.github/workflows/release\.yml|scripts/(package-release|setup|train|jdk)\.sh|apksim|install\.sh|scripts/(ctl|drive|instrument|affected|coverage|snapshot|crawl|crawl-select|device-profile|replay-adb|mcp|subsystem-audit)\.py)$|^packaging/'
            printf '%s\n' "$files" | grep -qE "$img" || image=false
            printf '%s\n' "$files" | grep -qE "$pkg" || package=false
          fi
          { echo "package=$package"; echo "image=$image"; } >> "$GITHUB_OUTPUT"
          echo "package: $package, image: $image"

  package:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'release' && needs.changes.outputs.package != 'false' }}
    runs-on: macos-15  # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-ci.${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      # Fetches Temurin 24 into work/jdk-24 (the JDK the release bundles), the libraries, builds the native runtime,
      # the runtime jar and the test app. No training: a release trains on the user's machine.
      - name: Build
        run: scripts/setup.sh --no-train
      - name: Package
        run: scripts/package-release.sh "$VERSION" dist
      - name: Check the installed release
        run: |
          mkdir -p "$RUNNER_TEMP/inst" "$RUNNER_TEMP/bin"
          tar -xzf "dist/apksim-$VERSION-macos-arm64.tar.gz" -C "$RUNNER_TEMP/inst"
          D="$RUNNER_TEMP/inst/apksim-$VERSION-macos-arm64"
          chmod -R a-w "$D"
          ln -s "$D/apksim" "$RUNNER_TEMP/bin/apksim"
          export APKSIM_HOME="$RUNNER_TEMP/state" APKSIM_STANDBY=0
          "$RUNNER_TEMP/bin/apksim" --version | grep -qx "apksim $VERSION"
          du -h "dist/apksim-$VERSION-macos-arm64.tar.gz"
          # The test app is not in the bundle: training downloads it and checks it against work/testapp.sha256.
          [[ ! -e "$D/work/testapp.apk" && -s "$D/work/testapp.sha256" ]]
          # A wrong file is refused, and nothing is trained on it.
          mkdir -p "$RUNNER_TEMP/bad"
          echo not-an-apk > "$RUNNER_TEMP/bad/apksim-testapp-$VERSION.apk"
          if APKSIM_DOWNLOAD_URL="file://$RUNNER_TEMP/bad" "$RUNNER_TEMP/bin/apksim" --train --headless 2> bad.log; then
            echo "training accepted a test app with the wrong checksum"; exit 1
          fi
          grep -q 'checksum mismatch' bad.log
          [[ ! -e "$APKSIM_HOME/app.aot" && ! -e "$APKSIM_HOME/testapp-$VERSION.apk" ]]
          APKSIM_DOWNLOAD_URL="file://$PWD/dist" "$RUNNER_TEMP/bin/apksim" --train --headless
          "$RUNNER_TEMP/bin/apksim" --headless --no-network --exit-after-first-frame "$APKSIM_HOME/testapp-$VERSION.apk" 2>&1 | tee launch.log
          grep -q first-frame launch.log
          # The shipped scripts run from the installed tree, not the repository: a crawl from the slot that launch
          # prepared (--keep-data reads the APK's package with subsystem-audit.py, which 0.60.0 did not ship).
          set -o pipefail
          python3 "$D/scripts/crawl.py" "$APKSIM_HOME/testapp-$VERSION.apk" --out "$RUNNER_TEMP/crawl" --keep-data \
            --max-screens 2 --max-seconds 180 -- --no-network 2>&1 | tee crawl.log
          python3 -c 'import json, sys; c = json.load(open(sys.argv[1])); assert c["screens"], c' "$RUNNER_TEMP/crawl/crawl.json"
      - name: Checksums
        run: |
          cd dist
          # package-release.sh wrote the test app beside the tarball (setup.sh builds it, or downloads it without an
          # Android SDK); the check above trained on it.
          shasum -a 256 "apksim-$VERSION-macos-arm64.tar.gz" "apksim-testapp-$VERSION.apk" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release
          path: |
            dist/SHA256SUMS
            launch.log
            crawl.log
            ${{ runner.temp }}/state/train-*.log
      # The files the draft release gets, made by `draft` once the images are pushed.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/apksim-${{ env.VERSION }}-macos-arm64.tar.gz
            dist/apksim-testapp-${{ env.VERSION }}.apk
            dist/SHA256SUMS
          compression-level: 0
          retention-days: 2

  # The test app's APKs, once, for both images (each trains its startup cache on the app) and the checks.
  apks:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'release' && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the test app
        uses: ./.github/actions/linux-build
        with:
          runtime: 'false'  # the image jobs compile it on their own architectures
      - uses: actions/upload-artifact@v4
        with:
          name: testapp
          path: |
            testapks/composeapp/app/build/outputs/apk
            testapks/composeapp/uiserver/build/outputs/apk
          retention-days: 2

  image:
    if: ${{ !cancelled() && github.event_name != 'release' && needs.apks.result == 'success' }}
    needs: apks
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-ci.${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: testapp
          path: testapks/composeapp
      - name: Build the runtime
        uses: ./.github/actions/linux-build
        with:
          test-app: 'false'
      - name: Build the image
        run: scripts/docker-build.sh "$IMAGE:$VERSION-${{ matrix.arch }}" --platform linux/${{ matrix.arch }} --build-arg VERSION="$VERSION"
      - name: Check its version
        run: docker run --rm "$IMAGE:$VERSION-${{ matrix.arch }}" --version | grep -qx "apksim $VERSION"
      - name: Save the image
        shell: bash  # -o pipefail: a failed save must fail here
        run: |
          command -v zstd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q zstd; }
          docker save "$IMAGE:$VERSION-${{ matrix.arch }}" | zstd -T0 -3 -q -o "$RUNNER_TEMP/image.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar.zst
          compression-level: 0
          retention-days: 2

  # Each image's checks in legs side by side (ci.yml's split; ~5-8 min each): app (an instance over the control channel,
  # the adb device on amd64, where the runner has adb; serve), device (network record/replay, data slots, the APK cache),
  # replay (replay, bisect, journeys, coverage, screenshot tests), crawl, and the androidTest suite in two shards, run as
  # another repository's CI would run it: one container, the image's own instrument.py.
  check:
    if: ${{ !cancelled() && github.event_name != 'release' && needs.image.result == 'success' }}
    needs: image
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  # every leg's failures from one run
      matrix:
        arch: [amd64, arm64]
        leg: [app, device, replay, crawl, tests-0, tests-1]
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-ci.${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: testapp
          path: testapks/composeapp
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Load the image
        shell: bash  # -o pipefail: a truncated download must fail here
        run: |
          command -v zstd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q zstd; }
          zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load && rm "$RUNNER_TEMP/image.tar.zst"
      - name: Smoke test (${{ matrix.leg }})
        if: ${{ !startsWith(matrix.leg, 'tests-') }}
        env:
          SMOKE_PARTS: ${{ fromJSON('{"app":"app serve","device":"device","replay":"replay","crawl":"crawl"}')[matrix.leg] }}
        run: |
          APK=testapks/composeapp/app/build/outputs/apk/debug/app-debug.apk
          if [ "${{ matrix.arch }}" = amd64 ]; then
            # The runner's Android SDK has adb, for the adb device check (adb-check.py); arm64 Linux has no platform-tools.
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            scripts/ci-smoke.sh "$IMAGE:$VERSION-amd64" "$APK" smoke \
              testapks/composeapp/uiserver/build/outputs/apk/debug/uiserver-debug.apk
          else
            scripts/ci-smoke.sh "$IMAGE:$VERSION-arm64" "$APK" smoke
          fi
      - name: androidTest suite (shard ${{ matrix.leg }} of 2)
        if: startsWith(matrix.leg, 'tests-')
        run: |
          mkdir -p tests
          cp testapks/composeapp/app/build/outputs/apk/debug/app-debug.apk tests/app.apk
          cp testapks/composeapp/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk tests/test.apk
          SHARD="${{ matrix.leg }}"
          docker run --rm -v "$PWD/tests:/work" --entrypoint instrument.py "$IMAGE:$VERSION-${{ matrix.arch }}" app.apk test.apk \
            --isolate -j 2 --shards 2 --shard "${SHARD#tests-}" --xml junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-check-${{ matrix.arch }}-${{ matrix.leg }}
          if-no-files-found: ignore
          path: |
            smoke/*.png
            smoke/*.log
            tests/junit.xml

  # For a required check: passes when `changes` passed and every job it chose passed (a skipped one counts as passed).
  release-checks:
    needs: [changes, package, apks, image, check]
    if: ${{ !cancelled() && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every release check that ran passed
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.package.result }} ${{ needs.apks.result }} ${{ needs.image.result }} ${{ needs.check.result }}
        run: |
          echo "changes, package, apks, image, check: $RESULTS"
          test "${{ needs.changes.result }}" = success
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done

  # Nothing is pushed until both images passed every leg and the Mac package passed its check. Each image is pushed from a
  # runner of its own architecture, as before.
  push:
    if: github.event_name != 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Load and push
        shell: bash
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          command -v zstd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q zstd; }
          zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$V-${{ matrix.arch }}"

  # :VERSION as both architectures, then the draft: publishing it moves :latest to that image, so the draft is made only
  # once the image of its version is pushed.
  draft:
    if: github.event_name != 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: :VERSION as both architectures
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$V" "$IMAGE:$V-amd64" "$IMAGE:$V-arm64"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "apksim $V" \
            --generate-notes "dist/apksim-$V-macos-arm64.tar.gz" "dist/apksim-testapp-$V.apk" dist/SHA256SUMS

  image-latest:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Point :latest at the published version
        env:
          TAG: ${{ github.event.release.tag_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${TAG#v}"

  tap:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then echo "no TAP_DEPLOY_KEY secret: the tap is not updated"; exit 0; fi
          V="${TAG#v}"
          gh release download "$TAG" -p SHA256SUMS
          SHA="$(grep " \*\{0,1\}apksim-$V-macos-arm64.tar.gz\$" SHA256SUMS | cut -d' ' -f1)"
          [ -n "$SHA" ] || { echo "no checksum for apksim-$V-macos-arm64.tar.gz"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:aglose/homebrew-apksim.git tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$V/g" -e "s/@SHA256@/$SHA/" packaging/homebrew/apksim.rb > tap/Casks/apksim.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/apksim.rb
          git diff --cached --quiet && { echo "the tap already has $V"; exit 0; }
          git commit -m "apksim $V"
          git push
