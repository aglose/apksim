<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1813" width="1200" height="1813" role="img" aria-labelledby="title desc">
<title id="title">apksim system design</title>
<desc id="desc">Ways in (Mac window, control channel, adb device, browser tab, MCP server, test runs) lead to the launcher, which hands the launch to a pre-booted standby JVM or starts a cold one. Inside the one process: the APK's DEX code translated to JVM bytecode, the real AOSP Android 16 framework with apksim's system-server stand-ins, the APK's native libraries loaded through an ELF loader and bionic shim, the Host main thread, and the frame pipeline from display lists through HWUI and Skia to an IOSurface on a Cocoa window. Out come test results, coverage, screenshots, flight recordings, network recordings and screen maps. It runs on macOS on Apple Silicon and in a Linux container.</desc>
