<defs>
<marker id="ah" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="1443" rx="14" class="bgr"/>
<text x="40" y="54" class="h1">apksim: system design</text>
<text x="40" y="84" class="sub">An unmodified APK runs as one ordinary process on the host’s CPU: no emulator, no virtual machine.</text>
<text x="40" y="119" class="note">Whose code:</text>
<rect x="136" y="104" width="22" height="22" rx="5" class="b app"/>
<text x="166" y="120" class="p">the app’s own</text>
<rect x="296" y="104" width="22" height="22" rx="5" class="b and"/>
<text x="326" y="120" class="p">Android’s own (AOSP)</text>
<rect x="516" y="104" width="22" height="22" rx="5" class="b sim"/>
<text x="546" y="120" class="p">apksim’s</text>
<rect x="642" y="104" width="22" height="22" rx="5" class="b host"/>
<text x="672" y="120" class="p">the host’s</text>
<circle cx="53" cy="170" r="13" class="num"/>
<text x="53" y="175" class="numt" text-anchor="middle">1</text>
<text x="76" y="176" class="s">Ways in</text>
<text x="1160" y="176" class="note" text-anchor="end">every one ends as the same commands on the Android main thread</text>
<rect x="40.0" y="194" width="175.0" height="78" rx="10" class="b card"/>
<rect x="48.0" y="206" width="5" height="54" rx="2.5" class="k-card"/>
<text x="64.0" y="225" class="tc">Mac window</text>
<text x="64.0" y="248" class="tag">apksim app.apk</text>
<rect x="229.0" y="194" width="175.0" height="78" rx="10" class="b card"/>
<rect x="237.0" y="206" width="5" height="54" rx="2.5" class="k-card"/>
<text x="253.0" y="225" class="tc">Control channel</text>
<text x="253.0" y="248" class="tag">--control</text>
<rect x="418.0" y="194" width="175.0" height="78" rx="10" class="b card"/>
<rect x="426.0" y="206" width="5" height="54" rx="2.5" class="k-card"/>
<text x="442.0" y="225" class="tc">adb device</text>
<text x="442.0" y="248" class="tag">--adb</text>
<rect x="607.0" y="194" width="175.0" height="78" rx="10" class="b card"/>
<rect x="615.0" y="206" width="5" height="54" rx="2.5" class="k-card"/>
<text x="631.0" y="225" class="tc">Browser tab</text>
<text x="631.0" y="248" class="tag">apksim serve</text>
<rect x="796.0" y="194" width="175.0" height="78" rx="10" class="b card"/>
<rect x="804.0" y="206" width="5" height="54" rx="2.5" class="k-card"/>
<text x="820.0" y="225" class="tc">AI agents</text>
<text x="820.0" y="248" class="tag">apksim mcp</text>
<rect x="985.0" y="194" width="175.0" height="78" rx="10" class="b card"/>
<rect x="993.0" y="206" width="5" height="54" rx="2.5" class="k-card"/>
<text x="1009.0" y="225" class="tc">Test runs</text>
<text x="1009.0" y="248" class="tag">--instrument</text>
<path d="M600,280 L600,306" class="a" marker-end="url(#ah)"/>
<circle cx="53" cy="332" r="13" class="num"/>
<text x="53" y="337" class="numt" text-anchor="middle">2</text>
<text x="76" y="338" class="s">Launch</text>
<rect x="40" y="356" width="300" height="100" rx="10" class="b sim"/>
<rect x="48" y="368" width="5" height="76" rx="2.5" class="k-sim"/>
<text x="64" y="387" class="t">The launcher</text>
<text x="64" y="410" class="p">starts the app inside a</text>
<text x="64" y="430" class="p">sandbox on macOS</text>
<path d="M346,406.0 L380,406.0" class="a" marker-end="url(#ah)"/>
<rect x="388" y="356" width="368.0" height="100" rx="10" class="b sim"/>
<rect x="396" y="368" width="5" height="76" rx="2.5" class="k-sim"/>
<text x="412" y="387" class="t">Warm launch</text>
<text x="412" y="410" class="p">handed to a standby JVM that has</text>
<text x="412" y="430" class="p">already booted the framework</text>
<text x="740.0" y="387" class="stat" text-anchor="end">first frame 0.2-0.5 s</text>
<text x="774.0" y="411.0" class="note" text-anchor="middle">or</text>
<rect x="792.0" y="356" width="368.0" height="100" rx="10" class="b sim"/>
<rect x="800.0" y="368" width="5" height="76" rx="2.5" class="k-sim"/>
<text x="816.0" y="387" class="t">Cold launch</text>
<text x="816.0" y="410" class="p">a new JVM starts from a cache</text>
<text x="816.0" y="430" class="p">of the framework’s classes</text>
<text x="1144.0" y="387" class="stat" text-anchor="end">first frame 1.1-1.6 s</text>
<path d="M600,464 L600,490" class="a" marker-end="url(#ah)"/>
<circle cx="53" cy="516" r="13" class="num"/>
<text x="53" y="521" class="numt" text-anchor="middle">3</text>
<text x="76" y="522" class="s">The process</text>
<text x="1160" y="522" class="note" text-anchor="end">one JVM: the Android main thread, a raster thread and the app’s own threads</text>
<rect x="40" y="540" width="1120" height="538" rx="14" class="proc"/>
<text x="60.0" y="570" class="c">App code</text>
<text x="426.6666666666667" y="570" class="c">Android framework</text>
<text x="793.3333333333334" y="570" class="c">Native code</text>
<rect x="60.0" y="584" width="346.7" height="98" rx="10" class="b app"/>
<rect x="68.0" y="596" width="5" height="74" rx="2.5" class="k-app"/>
<text x="84.0" y="615" class="t">The APK’s DEX code</text>
<text x="84.0" y="638" class="p">mapped from the APK, each class</text>
<text x="84.0" y="658" class="p">read when the app first needs it</text>
<rect x="60.0" y="712" width="346.7" height="98" rx="10" class="b sim"/>
<rect x="68.0" y="724" width="5" height="74" rx="2.5" class="k-sim"/>
<text x="84.0" y="743" class="t">DEX to JVM translator</text>
<text x="84.0" y="766" class="p">turns it into JVM bytecode, which</text>
<text x="84.0" y="786" class="p">HotSpot compiles like any Java</text>
<path d="M233.3,687 L233.3,701" class="a" marker-end="url(#ah)"/>
<rect x="426.7" y="584" width="346.7" height="98" rx="10" class="b and"/>
<rect x="434.7" y="596" width="5" height="74" rx="2.5" class="k-and"/>
<text x="450.7" y="615" class="t">Android 16 framework (AOSP)</text>
<text x="450.7" y="638" class="p">the real classes: Activity, View,</text>
<text x="450.7" y="658" class="p">Canvas, resources, SQLite</text>
<rect x="426.7" y="712" width="346.7" height="98" rx="10" class="b sim"/>
<rect x="434.7" y="724" width="5" height="74" rx="2.5" class="k-sim"/>
<text x="450.7" y="743" class="t">System-server stand-ins</text>
<text x="450.7" y="766" class="p">activity stack, windows, network,</text>
<text x="450.7" y="786" class="p">services, permissions, sensors</text>
<path d="M600.0,687 L600.0,701" class="a" marker-end="url(#ah)"/>
<rect x="793.3" y="584" width="346.7" height="98" rx="10" class="b app"/>
<rect x="801.3" y="596" width="5" height="74" rx="2.5" class="k-app"/>
<text x="817.3" y="615" class="t">The APK’s arm64 libraries</text>
<text x="817.3" y="638" class="p">run on the CPU as they are:</text>
<text x="817.3" y="658" class="p">nothing is emulated</text>
<rect x="793.3" y="712" width="346.7" height="98" rx="10" class="b sim"/>
<rect x="801.3" y="724" width="5" height="74" rx="2.5" class="k-sim"/>
<text x="817.3" y="743" class="t">ELF loader and bionic shim</text>
<text x="817.3" y="766" class="p">map the libraries in and answer</text>
<text x="817.3" y="786" class="p">their libc calls with the host’s</text>
<path d="M966.7,687 L966.7,701" class="a" marker-end="url(#ah)"/>
<rect x="60" y="832" width="1080" height="80" rx="10" class="b sim"/>
<rect x="68" y="844" width="5" height="56" rx="2.5" class="k-sim"/>
<text x="84" y="863" class="t">Host: the Android main thread</text>
<text x="84" y="886" class="p">keeps the activity stack, dispatches input and device controls, and draws one frame for each display vsync, up to 120 Hz</text>
<text x="60" y="946" class="c">A frame</text>
<rect x="60.0" y="960" width="240.0" height="98" rx="10" class="b and"/>
<rect x="68.0" y="972" width="5" height="74" rx="2.5" class="k-and"/>
<text x="84.0" y="991" class="t">Record</text>
<text x="84.0" y="1014" class="p">Views and Compose record</text>
<text x="84.0" y="1034" class="p">display lists</text>
<path d="M306.0,1009.0 L329.0,1009.0" class="a" marker-end="url(#ah)"/>
<rect x="340.0" y="960" width="240.0" height="98" rx="10" class="b and"/>
<rect x="348.0" y="972" width="5" height="74" rx="2.5" class="k-and"/>
<text x="364.0" y="991" class="t">Rasterise</text>
<text x="364.0" y="1014" class="p">Android’s own HWUI and</text>
<text x="364.0" y="1034" class="p">Skia, on a thread of theirs</text>
<path d="M586.0,1009.0 L609.0,1009.0" class="a" marker-end="url(#ah)"/>
<rect x="620.0" y="960" width="240.0" height="98" rx="10" class="b sim"/>
<rect x="628.0" y="972" width="5" height="74" rx="2.5" class="k-sim"/>
<text x="644.0" y="991" class="t">Present</text>
<text x="644.0" y="1014" class="p">straight into the window’s</text>
<text x="644.0" y="1034" class="p">surface: ~0.5 ms a frame</text>
<path d="M866.0,1009.0 L889.0,1009.0" class="a" marker-end="url(#ah)"/>
<rect x="900.0" y="960" width="240.0" height="98" rx="10" class="b host"/>
<rect x="908.0" y="972" width="5" height="74" rx="2.5" class="k-host"/>
<text x="924.0" y="991" class="t">Screen</text>
<text x="924.0" y="1014" class="p">a native window, or a</text>
<text x="924.0" y="1034" class="p">stream to a browser tab</text>
<path d="M600,1086 L600,1112" class="a" marker-end="url(#ah)"/>
<circle cx="53" cy="1138" r="13" class="num"/>
<text x="53" y="1143" class="numt" text-anchor="middle">4</text>
<text x="76" y="1144" class="s">What comes out</text>
<text x="1160" y="1144" class="note" text-anchor="end">most of it is input to another apksim command</text>
<rect x="40.0" y="1162" width="175.0" height="78" rx="10" class="b card"/>
<rect x="48.0" y="1174" width="5" height="54" rx="2.5" class="k-card"/>
<text x="64.0" y="1193" class="tc">Test results</text>
<text x="64.0" y="1216" class="p">JUnit XML, bundles</text>
<rect x="229.0" y="1162" width="175.0" height="78" rx="10" class="b card"/>
<rect x="237.0" y="1174" width="5" height="54" rx="2.5" class="k-card"/>
<text x="253.0" y="1193" class="tc">Coverage</text>
<text x="253.0" y="1216" class="p">JaCoCo and LCOV</text>
<rect x="418.0" y="1162" width="175.0" height="78" rx="10" class="b card"/>
<rect x="426.0" y="1174" width="5" height="54" rx="2.5" class="k-card"/>
<text x="442.0" y="1193" class="tc">Screenshots</text>
<text x="442.0" y="1216" class="p">goldens and diffs</text>
<rect x="607.0" y="1162" width="175.0" height="78" rx="10" class="b card"/>
<rect x="615.0" y="1174" width="5" height="54" rx="2.5" class="k-card"/>
<text x="631.0" y="1193" class="tc">Flight recordings</text>
<text x="631.0" y="1216" class="p">replay, bisect, view</text>
<rect x="796.0" y="1162" width="175.0" height="78" rx="10" class="b card"/>
<rect x="804.0" y="1174" width="5" height="54" rx="2.5" class="k-card"/>
<text x="820.0" y="1193" class="tc">Network (HAR)</text>
<text x="820.0" y="1216" class="p">replays, no backend</text>
<rect x="985.0" y="1162" width="175.0" height="78" rx="10" class="b card"/>
<rect x="993.0" y="1174" width="5" height="54" rx="2.5" class="k-card"/>
<text x="1009.0" y="1193" class="tc">Screen maps</text>
<text x="1009.0" y="1216" class="p">the crawler’s graph</text>
<circle cx="53" cy="1284" r="13" class="num"/>
<text x="53" y="1289" class="numt" text-anchor="middle">5</text>
<text x="76" y="1290" class="s">Runs on</text>
<rect x="40" y="1308" width="550.0" height="80" rx="10" class="b host"/>
<rect x="48" y="1320" width="5" height="56" rx="2.5" class="k-host"/>
<text x="64" y="1339" class="t">macOS on Apple Silicon</text>
<text x="64" y="1362" class="p">a native window, Metal and VideoToolbox; warm launches</text>
<rect x="610.0" y="1308" width="550.0" height="80" rx="10" class="b host"/>
<rect x="618.0" y="1320" width="5" height="56" rx="2.5" class="k-host"/>
<text x="634.0" y="1339" class="t">Linux container, x86_64 or arm64</text>
<text x="634.0" y="1362" class="p">headless, drawn on the CPU; needs no KVM, so any CI runner</text>
<text x="40" y="1418" class="note">Timings: an M4 Pro, the median of 5 launches of a small Compose app and of a large R8 app.</text>
</svg>
