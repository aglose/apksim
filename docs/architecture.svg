<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1444" width="1200" height="1444" role="img" aria-labelledby="title desc">
<title id="title">apksim system design</title>
<desc id="desc">Six ways in (Mac window, control channel, adb device, browser tab, MCP server, test runs) lead to the launcher, which hands the launch to a pre-booted standby JVM or starts a cold one. Inside the one process, three columns: the APK's DEX code and the translator that turns it into JVM bytecode; the real AOSP Android 16 framework over apksim's system-server stand-ins; the APK's arm64 native libraries over an ELF loader and bionic shim. Below them the Host main thread, and a frame's path: record, rasterise with HWUI and Skia, present, screen. Out come test results, coverage, screenshots, flight recordings, network recordings and screen maps. It runs on macOS on Apple Silicon and in a Linux container.</desc>
