<defs>
<marker id="ah" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="ah" d="M0,0 L8,4 L0,8 Z"/></marker>
<marker id="ahs" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="ah" d="M8,0 L0,4 L8,8 Z"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="1812" rx="14" class="bgr"/>
<text x="40" y="54" class="h1">apksim: system design</text>
<text x="40" y="82" class="sub">An unmodified APK runs as one ordinary process on the host’s CPU: no emulator, no virtual machine, no install step.</text>
<text x="40" y="113" class="note">Whose code:</text>
<rect x="132" y="101" width="16" height="16" rx="4" class="b app"/>
<text x="155" y="113" class="p">the app’s own</text>
<rect x="256" y="101" width="16" height="16" rx="4" class="b and"/>
<text x="279" y="113" class="p">Android’s own (AOSP 16)</text>
<rect x="452" y="101" width="16" height="16" rx="4" class="b sim"/>
<text x="475" y="113" class="p">apksim</text>
<rect x="534" y="101" width="16" height="16" rx="4" class="b host"/>
<text x="557" y="113" class="p">the host OS</text>
<circle cx="51" cy="153.5" r="11" class="num"/>
<text x="51" y="158" class="numt" text-anchor="middle">1</text>
<text x="70" y="158" class="s">WAYS IN</text>
<text x="1160" y="158" class="note" text-anchor="end">each is a launch option or subcommand; all end as the same commands on the Android main thread</text>
<rect x="40" y="172" width="354" height="74" rx="8" class="b card"/>
<text x="380" y="196" class="tag" text-anchor="end">apksim app.apk</text>
<text x="54" y="196" class="t">Mac window</text>
<text x="54" y="216" class="p">mouse, keyboard and trackpad gestures;</text>
<text x="54" y="234" class="p">iOS-Simulator-style menus, device skins</text>
<rect x="423" y="172" width="354" height="74" rx="8" class="b card"/>
<text x="763" y="196" class="tag" text-anchor="end">--control</text>
<text x="437" y="196" class="t">Control channel</text>
<text x="437" y="216" class="p">one command a line: <tspan class="m">drive.py</tspan>, <tspan class="m">ctl.py</tspan>,</text>
<text x="437" y="234" class="p">fleets, scenes, snapshots, the crawler</text>
<rect x="806" y="172" width="354" height="74" rx="8" class="b card"/>
<text x="1146" y="196" class="tag" text-anchor="end">--adb</text>
<text x="820" y="196" class="t">adb device</text>
<text x="820" y="216" class="p"><tspan class="m">adb</tspan>, the Android CLI, <tspan class="m">uiautomator dump</tspan>,</text>
<text x="820" y="234" class="p">logcat, push and pull, on-device servers</text>
<rect x="40" y="263" width="354" height="74" rx="8" class="b card"/>
<text x="380" y="287" class="tag" text-anchor="end">apksim serve</text>
<text x="54" y="287" class="t">Browser tab</text>
<text x="54" y="307" class="p">an APK per tab, streamed; compare mode,</text>
<text x="54" y="325" class="p">PR previews; <tspan class="m">beam</tspan> runs it on your own Mac</text>
<rect x="423" y="263" width="354" height="74" rx="8" class="b card"/>
<text x="763" y="287" class="tag" text-anchor="end">apksim mcp</text>
<text x="437" y="287" class="t">AI agents</text>
<text x="437" y="307" class="p">an MCP server: launch, tap, type, and read</text>
<text x="437" y="325" class="p">the screen as a short list of nodes</text>
<rect x="806" y="263" width="354" height="74" rx="8" class="b card"/>
<text x="1146" y="287" class="tag" text-anchor="end">--instrument</text>
<text x="820" y="287" class="t">Test runs</text>
<text x="820" y="307" class="p">androidTest APKs: Compose, Espresso,</text>
<text x="820" y="325" class="p">UiAutomator; shards, isolation, a warm pool</text>
<path d="M180,337 V379" class="a" marker-end="url(#ah)"/>
<circle cx="51" cy="369.5" r="11" class="num"/>
<text x="51" y="374" class="numt" text-anchor="middle">2</text>
<text x="70" y="374" class="s">LAUNCH</text>
<rect x="40" y="388" width="280" height="116" rx="8" class="b sim"/>
<text x="54" y="412" class="t"><tspan class="m">apksim app.apk</tspan></text>
<text x="54" y="432" class="p">the launcher: bash builtins only,</text>
<text x="54" y="450" class="p">as each fork cost a few ms; the</text>
<text x="54" y="468" class="p">instance then runs inside a</text>
<text x="54" y="486" class="p"><tspan class="m">sandbox-exec</tspan> profile on macOS</text>
<rect x="350" y="388" width="810" height="56" rx="8" class="b sim"/>
<text x="1146" y="412" class="stat" text-anchor="end">window ~10 ms · first frame 0.2-0.5 s</text>
<text x="364" y="412" class="t">Warm launch</text>
<text x="364" y="432" class="p"><tspan class="m">apksim-client</tspan> hands the APK and the terminal’s stdio to a standby JVM, pre-booted like Android’s zygote</text>
<rect x="350" y="448" width="810" height="56" rx="8" class="b sim"/>
<text x="1146" y="472" class="stat" text-anchor="end">first frame 1.1-1.6 s</text>
<text x="364" y="472" class="t">Cold launch</text>
<text x="364" y="492" class="p">a new JVM 24 starts from an AOT cache that already holds the framework’s classes; test runs start this way</text>
<path d="M320,416 H343" class="a" marker-end="url(#ah)"/>
<path d="M320,476 H343" class="a" marker-end="url(#ah)"/>
<path d="M755,504 V541" class="a" marker-end="url(#ah)"/>
<rect x="24" y="548" width="1152" height="844" rx="12" class="proc"/>
<circle cx="51" cy="575.5" r="11" class="num"/>
<text x="51" y="580" class="numt" text-anchor="middle">3</text>
<text x="70" y="580" class="s">THE PROCESS</text>
<text x="1160" y="580" class="note" text-anchor="end">one JVM 24 (HotSpot) process: the Android main thread, a raster thread, the app’s own threads</text>
<text x="40" y="608" class="c">APP CODE</text>
<text x="423" y="608" class="c">ANDROID FRAMEWORK</text>
<text x="806" y="608" class="c">NATIVE CODE</text>
<rect x="40" y="618" width="354" height="56" rx="8" class="b app"/>
<text x="54" y="642" class="t">The APK’s DEX files</text>
<text x="54" y="662" class="p">mapped in place, classes read on demand</text>
<path d="M217,675.5 v9" class="a" marker-end="url(#ah)"/>
<rect x="40" y="692" width="354" height="92" rx="8" class="b sim"/>
<text x="54" y="716" class="t">DEX → JVM bytecode translator</text>
<text x="54" y="736" class="p">written from scratch; lazy, class by class;</text>
<text x="54" y="754" class="p">registers become typed locals; big methods</text>
<text x="54" y="772" class="p">are split; network and clock calls are hooked</text>
<path d="M217,785.5 v9" class="a" marker-end="url(#ah)"/>
<rect x="40" y="802" width="354" height="56" rx="8" class="b sim"/>
<text x="54" y="826" class="t">Class cache</text>
<text x="54" y="846" class="p">per DEX file: only what changed is redone</text>
<path d="M217,859.5 v9" class="a" marker-end="url(#ah)"/>
<rect x="40" y="876" width="354" height="74" rx="8" class="b app"/>
<text x="54" y="900" class="t">App classes on the JVM</text>
<text x="54" y="920" class="p">JVM bytecode: JIT-compiled by HotSpot,</text>
<text x="54" y="938" class="p">breakpoints and locals over JDWP</text>
<rect x="423" y="618" width="354" height="128" rx="8" class="b and"/>
<text x="437" y="642" class="t">AOSP Android 16 framework (API 36)</text>
<text x="437" y="662" class="p">The real classes, from <tspan class="m">android-all</tspan>:</text>
<text x="437" y="680" class="p">Activity, View, Canvas, text, resources,</text>
<text x="437" y="698" class="p">SQLite, MediaCodec, WindowManager. Calls</text>
<text x="437" y="716" class="p">bind straight to the original or its stand-in,</text>
<text x="437" y="734" class="p">with no dispatch in between.</text>
<rect x="423" y="764" width="354" height="186" rx="8" class="b sim"/>
<text x="437" y="788" class="t">System-server stand-ins</text>
<text x="437" y="808" class="p">Robolectric’s shadows and apksim’s own do</text>
<text x="437" y="826" class="p">what a device’s system server and apps do:</text>
<text x="437" y="844" class="p">· activity stack and lifecycle, windows, insets</text>
<text x="437" y="862" class="p">· touch routing, system bars, soft keyboard</text>
<text x="437" y="880" class="p">· connectivity, Wi-Fi, sticky broadcasts</text>
<text x="437" y="898" class="p">· services, jobs, alarms, FCM pushes</text>
<text x="437" y="916" class="p">· permissions, biometrics, keystore, settings</text>
<text x="437" y="934" class="p">· Bluetooth LE peripherals, camera, location</text>
<rect x="806" y="618" width="354" height="74" rx="8" class="b app"/>
<text x="820" y="642" class="t">The APK’s arm64 .so libraries</text>
<text x="820" y="662" class="p">run directly on the CPU: same instruction set,</text>
<text x="820" y="680" class="p">so nothing is emulated</text>
<path d="M983,693.5 v9" class="a" marker-end="url(#ah)"/>
<rect x="806" y="710" width="354" height="128" rx="8" class="b sim"/>
<text x="820" y="734" class="t">ELF loader, bionic shim, JNI bridge</text>
<text x="820" y="754" class="p">maps and relocates Android ELF in process;</text>
<text x="820" y="772" class="p">bionic → libSystem (glibc on Linux): structs,</text>
<text x="820" y="790" class="p">errno, pthreads, TLS, sockets; trampolines</text>
<text x="820" y="808" class="p">where the varargs ABIs differ; 4 KB-aligned</text>
<text x="820" y="826" class="p">libraries on 16 KB pages</text>
<rect x="806" y="856" width="354" height="94" rx="8" class="b and"/>
<text x="820" y="880" class="t">Android’s native runtime</text>
<text x="820" y="900" class="p">Skia, HWUI, SQLite, ICU, fonts: Android’s</text>
<text x="820" y="918" class="p">own C++, built for the host by Robolectric</text>
<path d="M394,913 H408.5 V702 H416" class="a" marker-end="url(#ah)"/>
<path d="M785,654 H798" class="a" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<text x="791.5" y="645" class="tiny" text-anchor="middle">JNI</text>
<path d="M777,730 H791.5 V893 H799" class="a" marker-end="url(#ah)"/>
<rect x="40" y="974" width="1120" height="74" rx="8" class="b sim"/>
<text x="54" y="998" class="t"><tspan class="m">Host</tspan>: the Android main thread</text>
<text x="54" y="1018" class="p">runs the main looper, keeps the activity stack as a device’s activity manager does, dispatches input and device controls (rotation, dark mode, locale ...),</text>
<text x="54" y="1036" class="p">and draws one frame per display vsync, up to 120 Hz; with nothing to do it sleeps until the next message is due</text>
<path d="M168,1048 V1081" class="a" marker-end="url(#ah)"/>
<text x="182" y="1075" class="c">A FRAME</text>
<rect x="40" y="1088" width="257" height="74" rx="8" class="b and"/>
<text x="54" y="1112" class="t">Record</text>
<text x="54" y="1132" class="p">Views and Compose record</text>
<text x="54" y="1150" class="p">display lists (main thread)</text>
<rect x="327" y="1088" width="257" height="74" rx="8" class="b and"/>
<text x="341" y="1112" class="t">Rasterise</text>
<text x="341" y="1132" class="p">Android’s HWUI and Skia, on a</text>
<text x="341" y="1150" class="p">thread of their own, on the CPU</text>
<path d="M301,1125 h16" class="a" marker-end="url(#ah)"/>
<rect x="614" y="1088" width="257" height="74" rx="8" class="b sim"/>
<text x="628" y="1112" class="t">Present</text>
<text x="628" y="1132" class="p">straight into an IOSurface on</text>
<text x="628" y="1150" class="p">the window: ~0.5 ms a frame</text>
<path d="M588,1125 h16" class="a" marker-end="url(#ah)"/>
<rect x="901" y="1088" width="257" height="74" rx="8" class="b host"/>
<text x="915" y="1112" class="t">Screen</text>
<text x="915" y="1132" class="p">a native Cocoa window, paced</text>
<text x="915" y="1150" class="p">to the display’s vsync</text>
<path d="M875,1125 h16" class="a" marker-end="url(#ah)"/>
<path d="M168,1186 V1169" class="a" marker-end="url(#ah)"/>
<path d="M455,1186 V1169" class="a" marker-end="url(#ah)"/>
<path d="M742,1162 V1179" class="a" marker-end="url(#ah)"/>
<rect x="40" y="1186" width="257" height="74" rx="8" class="b sim"/>
<text x="54" y="1210" class="t">Video</text>
<text x="54" y="1230" class="p">MediaCodec decodes on</text>
<text x="54" y="1248" class="p">VideoToolbox, or libavcodec</text>
<rect x="327" y="1186" width="257" height="74" rx="8" class="b sim"/>
<text x="341" y="1210" class="t">Metal</text>
<text x="341" y="1230" class="p">AGSL shaders, layer effects,</text>
<text x="341" y="1248" class="p">bitmap scaling: on the GPU</text>
<rect x="614" y="1186" width="546" height="74" rx="8" class="b sim"/>
<text x="628" y="1210" class="t">The same frame also feeds</text>
<text x="628" y="1230" class="p">screenshots and golden diffs, screen recording, the flight recorder’s</text>
<text x="628" y="1248" class="p">frame ring, and the H.264 or JPEG stream of <tspan class="m">apksim serve</tspan></text>
<text x="40" y="1286" class="c">THE REST OF THE SIMULATED DEVICE</text>
<rect x="40" y="1296" width="257" height="74" rx="8" class="b sim"/>
<text x="54" y="1320" class="t">Network engine</text>
<text x="54" y="1340" class="p">records to HAR, replays with</text>
<text x="54" y="1358" class="p">no backend; offline, 3G, lossy</text>
<rect x="327" y="1296" width="257" height="74" rx="8" class="b sim"/>
<text x="341" y="1320" class="t">Flight recorder</text>
<text x="341" y="1340" class="p">rings of input, logcat, network,</text>
<text x="341" y="1358" class="p">SQLite and frames; checkpoints</text>
<rect x="614" y="1296" width="257" height="74" rx="8" class="b sim"/>
<text x="628" y="1320" class="t">Clocks</text>
<text x="628" y="1340" class="p">a settable wall clock and zone;</text>
<text x="628" y="1358" class="p">uptime simulated or real-time</text>
<rect x="901" y="1296" width="257" height="74" rx="8" class="b sim"/>
<text x="915" y="1320" class="t">Data slots</text>
<text x="915" y="1340" class="p">app data, <tspan class="m">/sdcard</tspan> and Settings</text>
<text x="915" y="1358" class="p">kept per app, or <tspan class="m">--fresh</tspan></text>
<path d="M600,1392 v30" class="a" marker-end="url(#ah)"/>
<circle cx="51" cy="1441.5" r="11" class="num"/>
<text x="51" y="1446" class="numt" text-anchor="middle">4</text>
<text x="70" y="1446" class="s">WHAT COMES OUT</text>
<rect x="40" y="1460" width="354" height="74" rx="8" class="b card"/>
<text x="54" y="1484" class="t">Test results</text>
<text x="54" y="1504" class="p">JUnit XML; a failure bundle per failing test:</text>
<text x="54" y="1522" class="p">screen, node tree, log, threads, <tspan class="m">repro.sh</tspan></text>
<rect x="423" y="1460" width="354" height="74" rx="8" class="b card"/>
<text x="437" y="1484" class="t">Coverage and test impact</text>
<text x="437" y="1504" class="p">JaCoCo and LCOV with no rebuild; only the</text>
<text x="437" y="1522" class="p">tests a change reaches; balanced shards</text>
<rect x="806" y="1460" width="354" height="74" rx="8" class="b card"/>
<text x="820" y="1484" class="t">Screenshots and goldens</text>
<text x="820" y="1504" class="p">devices × dark mode × locales × text sizes,</text>
<text x="820" y="1522" class="p">byte-identical run to run, HTML diff report</text>
<rect x="40" y="1551" width="354" height="74" rx="8" class="b card"/>
<text x="54" y="1575" class="t">Flight recordings (<tspan class="m">.apkrec</tspan>)</text>
<text x="54" y="1595" class="p">replay, bisect across builds, turn into a</text>
<text x="54" y="1613" class="p">journey test, open in the trace viewer</text>
<rect x="423" y="1551" width="354" height="74" rx="8" class="b card"/>
<text x="437" y="1575" class="t">Network recordings (HAR)</text>
<text x="437" y="1595" class="p">hermetic replays with no backend, for</text>
<text x="437" y="1613" class="p">running instances and test runs alike</text>
<rect x="806" y="1551" width="354" height="74" rx="8" class="b card"/>
<text x="820" y="1575" class="t">Screen maps</text>
<text x="820" y="1595" class="p">the crawler’s graph of screens, captured</text>
<text x="820" y="1613" class="p">across a matrix; a resilience sweep of each</text>
<circle cx="51" cy="1660.5" r="11" class="num"/>
<text x="51" y="1665" class="numt" text-anchor="middle">5</text>
<text x="70" y="1665" class="s">RUNS ON</text>
<rect x="40" y="1679" width="551" height="74" rx="8" class="b host"/>
<text x="54" y="1703" class="t">macOS on Apple Silicon</text>
<text x="54" y="1723" class="p">Cocoa window, IOSurface, Metal, VideoToolbox, CoreAudio,</text>
<text x="54" y="1741" class="p"><tspan class="m">sandbox-exec</tspan>, warm standbys; arm64 libraries run natively</text>
<rect x="609" y="1679" width="551" height="74" rx="8" class="b host"/>
<text x="623" y="1703" class="t">Linux container, x86_64 or arm64</text>
<text x="623" y="1723" class="p">headless: CPU shaders, Mesa for GLES, libavcodec, OpenH264,</text>
<text x="623" y="1741" class="p">a bionic → glibc shim; needs no KVM, so any CI runner will do</text>
<text x="40" y="1785" class="note">Timings: an M4 Pro, median of 5 launches of a small Compose app and a large R8 app. Each box is described in AGENTS.md.</text>
</svg>
